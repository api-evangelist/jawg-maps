meters:
- name: tile_requests
  description: Raster and vector map tile fetches, counted against the monthly request allowance.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - style
- name: static_map_requests
  description: Static map image renders, counted against the monthly request allowance.
  unit: requests
  aggregation: sum
  dimensions:
  - account
- name: places_requests
  description: Geocoding, autocomplete, reverse, and place-detail calls to the Places API.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - endpoint
- name: routing_requests
  description: Routing and optimized_route calls (Valhalla).
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - costing
- name: matrix_requests
  description: sources_to_targets time-distance matrix calls.
  unit: requests
  aggregation: sum
  dimensions:
  - account
- name: isochrone_requests
  description: Isochrone / isodistance contour calls.
  unit: requests
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track request volume per API and per token in the Jawg App account against the monthly allowance.
- name: Allocation
  description: Issue a distinct access token per app/environment and domain-restrict it to map spend to a workload.
- name: Optimization
  description: Cache tiles and geocoding/reverse results, debounce autocomplete, and reuse static map images to cut request volume.
- name: Accountability
  description: Assign an owner per token; review monthly request burn against the plan allowance and upgrade before overage.
