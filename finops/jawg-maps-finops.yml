description: >-
  FinOps view of Jawg spend. Jawg bills on a request-based subscription model:
  a monthly plan includes a request allowance shared across Maps (tiles),
  Places, Routing, Matrix, Isochrone, and Static Maps, with overage or an
  upgrade beyond the allowance. Cost is therefore driven by total API request
  volume, so caching tiles and geocoding results is the primary lever.
notes: >-
  Per-plan request allowances and prices are subject to change; verify against
  the Jawg pricing page during reconciliation.
sources:
- https://www.jawg.io/en/pricing/
- https://www.jawg.io/docs/
- https://focus.finops.org/focus-specification/v1-3/
